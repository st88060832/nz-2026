<style>

  html,body { height:100%; }
  body { margin:0; background:var(--cream); color:var(--brown); display:grid; place-items:center;

  input[type=password] { width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--cream);

  button { font-size:16px; padding:12px; border-radius:999px; border:0; background:var(--brown); color:var(--cream); cursor:pointer; }

  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
  function hex(u){ return Array.from(u).map(function(x){return x.toString(16).padStart(2,"0");}).join(""); }
  function unhex(h){ var u=new Uint8Array(h.length/2); for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16); return u; }
  async function derive(pw){
    var base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);

  async function decrypt(bits){
    var key=await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"AES-CBC"}, false, ["decrypt"]);

  }

  async function open(bits){ show(await decrypt(bits)); }
  var msg=document.getElementById("msg"), go=document.getElementById("go");

      var plain=await decrypt(bits);
      if(document.getElementById("rm").checked){ try{localStorage.setItem(KEY, hex(bits));}catch(err){} }
