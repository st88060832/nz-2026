<style>

  html,body { height:100%; }
  body { margin:0; background:var(--cream); color:var(--brown); display:grid; place-items:center;

  .box { width:100%; max-width:360px; text-align:center; }

  input[type=password] { width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--cream);

  button { font-size:16px; padding:12px; border-radius:999px; border:0; background:var(--brown); color:var(--cream); cursor:pointer; }

  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
  function hex(u){ return Array.from(u).map(function(x){return x.toString(16).padStart(2,"0");}).join(""); }
  function unhex(h){ var u=new Uint8Array(h.length/2); for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16); return u; }
  async function derive(pw){
    var base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"}, base, 384));
  }
  async function decrypt(bits){
    var key=await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"AES-CBC"}, false, ["decrypt"]);
    var plain=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC", iv:bits.slice(32,48)}, key, b64(DATA)));
    if(plain.slice(0,15).toLowerCase()!=="<!doctype html>") throw new Error("bad");
    return plain;
  }
  function show(plain){ document.open(); document.write(plain); document.close(); }
  async function open(bits){ show(await decrypt(bits)); }
  var msg=document.getElementById("msg"), go=document.getElementById("go");
  if(!window.crypto||!crypto.subtle){ msg.textContent="這個瀏覽器無法解鎖，請改用 Safari 或 Chrome。"; go.disabled=true; return; }
  try { var saved=localStorage.getItem(KEY); if(saved){ msg.textContent="解鎖中…"; open(unhex(saved)).catch(function(){ try{localStorage.removeItem(KEY);}catch(e){} msg.textContent=""; }); } } catch(e){}
  document.getElementById("f").addEventListener("submit", async function(e){
    e.preventDefault(); go.disabled=true; msg.textContent="解鎖中…";
    try {
      var bits=await derive(document.getElementById("pw").value);
      var plain=await decrypt(bits);
      if(document.getElementById("rm").checked){ try{localStorage.setItem(KEY, hex(bits));}catch(err){} }
      show(plain);
    } catch(err){ msg.textContent="密碼不正確，請再試一次。"; go.disabled=false; }
